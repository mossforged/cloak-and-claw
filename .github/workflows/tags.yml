name: gate-tags
on:
  push:
    branches: [main]
    paths: [docs/tags.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing tags from docs/tags.txt
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          grep -v '^\s*#' docs/tags.txt | grep -v '^\s*$' | while read -r tag sha note; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "exists: $tag"
            else
              git tag -a "$tag" "$sha" -m "$note"
              git push origin "refs/tags/$tag"
              echo "created: $tag -> $sha"
            fi
          done
