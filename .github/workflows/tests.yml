name: tests
on:
  push:
  pull_request:
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # T026 r3: only the master the paint check compares against (tests/paint.test.mjs; other LFS source stays unfetched)
      - run: git lfs pull --include "assets/source/A018-rat-parts/reference.png"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
