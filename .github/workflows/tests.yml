name: tests
on:
  push:
  pull_request:
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # only the source images the tests read (T042: tools/lfs-needed.mjs lists them: two masters + v3's swaps)
      - run: git lfs pull --include "$(node tools/lfs-needed.mjs)"
      - run: npm test
